# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version | head -n2
          git ls-files '*.sh' | xargs shellcheck

  devcontainer-image:
    name: Dev container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built on every run; layers come from the GitHub Actions cache. Nothing is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          tags: rmxp3ds-dev:ci
          load: true
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,scope=devcontainer,mode=max
      - name: Tool versions
        run: |
          docker run --rm rmxp3ds-dev:ci bash -c '
            arm-none-eabi-gcc --version | head -n1
            ruby -v
            makerom 2>&1 | head -n1
            cat /opt/tools/.stamps/azahar'
