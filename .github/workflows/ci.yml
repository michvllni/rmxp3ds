# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version | head -n2
          git ls-files '*.sh' | xargs shellcheck

  devcontainer-image:
    name: Dev container image, 3DS build, Azahar smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built on every run; layers come from the GitHub Actions cache. Nothing is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          tags: rmxp3ds-dev:ci
          load: true
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,scope=devcontainer,mode=max
      - name: Tool versions
        run: |
          docker run --rm rmxp3ds-dev:ci bash -c '
            arm-none-eabi-gcc --version | head -n1
            ruby -v
            makerom 2>&1 | head -n1
            cat /opt/tools/.stamps/azahar'
      # Runs as the runner's UID so the build output in the bind-mounted checkout stays writable.
      - name: Build hello-world (.3dsx)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspaces/rmxp3ds" -w /workspaces/rmxp3ds rmxp3ds-dev:ci bash -c '
              cmake -S tools/hello -B build/hello -G Ninja -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake"
              cmake --build build/hello'
      # Headless Azahar with Mesa software rendering (no /dev/dri on hosted runners).
      - name: Azahar smoke test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspaces/rmxp3ds" -w /workspaces/rmxp3ds rmxp3ds-dev:ci \
            tests/smoke/azahar-smoke.sh --3dsx build/hello/hello.3dsx \
              --result rmxp3ds/test/hello.txt --expect '^RMXP3DS_TEST hello PASS' \
              --timeout 180 --screenshot build/hello-smoke.png
      # M1: CRuby for the 3DS (runtime/3ds/ruby) and the Ruby test/benchmark app.
      - name: Build CRuby for 3DS and tools/bench (.3dsx)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspaces/rmxp3ds" -w /workspaces/rmxp3ds rmxp3ds-dev:ci bash -c '
              set -euo pipefail
              runtime/3ds/ruby/build.sh --jobs "$(nproc)"
              cmake -S tools/bench -B build/bench -G Ninja -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake"
              cmake --build build/bench'
      # Scripts and fixture from the virtual SD card (M1: "runs a script from SD").
      - name: Azahar Ruby test (scripts from SD)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspaces/rmxp3ds" -w /workspaces/rmxp3ds rmxp3ds-dev:ci \
            tests/smoke/azahar-smoke.sh --3dsx build/bench/bench.3dsx \
              --result rmxp3ds/test/rubybench.txt --expect '^RMXP3DS_TEST rubybench PASS' \
              --sd-file tools/bench/romfs/bench.rb=rmxp3ds/test/bench.rb \
              --sd-file tools/bench/romfs/rgss_stubs.rb=rmxp3ds/test/rgss_stubs.rb \
              --sd-file build/bench/romfs/Map001.rxdata=rmxp3ds/test/Map001.rxdata \
              --timeout 600 --screenshot build/bench-smoke.png
      # M2 pipeline with a synthetic game (no game content): game scripts from Scripts.rxdata in
      # the headless RGSS environment, on the host and in Azahar; both must compute the same digest.
      - name: M2 pipeline test (synthetic game, host + Azahar)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/workspaces/rmxp3ds" -w /workspaces/rmxp3ds rmxp3ds-dev:ci bash -c '
              set -euo pipefail
              ruby tests/fixtures/make-game.rb --out build/m2/synthetic-game
              host="$(tools/m2/m2.sh host --game build/m2/synthetic-game --bench synthetic 2>&1)"
              echo "$host"
              digest="$(sed -n "s/^synthetic .* digest=\([0-9]*\) .*/\1/p" <<<"$host")"
              [ -n "$digest" ] || { echo "no digest from the host run" >&2; exit 1; }
              tools/m2/m2.sh azahar --game build/m2/synthetic-game --bench synthetic \
                --env "EXPECT_DIGEST=$digest" --timeout 300'
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-tests
          path: |
            build/hello/hello.3dsx
            build/hello-smoke.png
            build/bench/bench.3dsx
            build/bench-smoke.png
          if-no-files-found: ignore
          retention-days: 14
